server:
  port: 8080
  servlet:
    context-path: /banco
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: servicio-banco-shibasito
  
  # Configuración de Base de Datos PostgreSQL
  datasource:
    url: jdbc:postgresql://postgres-banco:5432/banco_db
    username: ${DB_USERNAME:banco_user}
    password: ${DB_PASSWORD:banco_pass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      max-lifetime: 1200000
      pool-name: BancoHikariPool
  
  # Configuración JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
    defer-datasource-initialization: false
  
  # Configuración RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 30000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      reply-timeout: 5000
      exchange: banco.exchange
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0
  
  # Configuración de Jackson (JSON)
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: America/Lima
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
  
  # Configuración de Mensajes
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600
  
  # Configuración de Perfiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Configuración JWT
jwt:
  secret: ${JWT_SECRET:mi-clave-secreta-super-segura-para-jwt-shibasito-2025}
  expiration: ${JWT_EXPIRATION:86400} # 24 horas en segundos
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800} # 7 días en segundos

# Configuración de Seguridad
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

# Configuración de Logging
logging:
  level:
    com.banco.shibasito: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_PARAM_LOG_LEVEL:WARN}
    org.springframework.amqp: ${RABBITMQ_LOG_LEVEL:INFO}
    com.fasterxml.jackson: ${JACKSON_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:/app/logs/banco-shibasito.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}

# Configuración de Gestión (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:always}
      show-components: always
      probes:
        enabled: true
    metrics:
      enabled: true
  info:
    env:
      enabled: true
    git:
      mode: full
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s

# Configuración Personalizada de la Aplicación
app:
  # Configuración de Paginación
  pagination:
    default-page-size: 20
    max-page-size: 100
  
  # Configuración de Rate Limiting
  rate-limit:
    enabled: true
    requests-per-minute: 100
  
  # Configuración de Auditoría
  audit:
    enabled: true
    include-sensitive-data: false
  
  # Configuración de Cache
  cache:
    ttl: 300 # 5 minutos en segundos
    max-size: 1000
  
  # Configuración de Validación
  validation:
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-numbers: true
      require-special-chars: true

# Configuración de Transacciones
transaction:
  default-timeout: 30 # segundos
  rollback-on-commit-failure: true

# Configuración de HTTP Client
http:
  client:
    connect-timeout: 5000
    read-timeout: 10000
    max-pool-size: 20
    max-per-route: 5

# Configuración de Límites
limits:
  max-file-size: 10MB
  max-request-size: 10MB
  request-body-limit: 10MB

# Configuración de Retry
retry:
  max-attempts: 3
  initial-interval: 1000
  multiplier: 2.0
  max-interval: 5000

# Configuración de Circuit Breaker (si se usa Resilience4j)
resilience4j:
  circuitbreaker:
    instances:
      servicio-cliente:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        sliding-window-size: 10
        minimum-number-of-calls: 5
  retry:
    instances:
      servicio-cliente:
        max-attempts: 3
        wait-duration: 200ms
  ratelimiter:
    instances:
      servicio-cliente:
        limit-for-period: 10
        limit-refresh-period: 1s
