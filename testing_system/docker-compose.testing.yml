# Docker Compose para Sistema de Testing
# =====================================

version: '3.8'

services:
  # Servicio principal de testing
  testing:
    build:
      context: .
      dockerfile: Dockerfile.testing
    container_name: shibasito_testing_system
    command: python run_all_tests.py --generate-report
    volumes:
      - ./reports:/app/reports
      - ./execution_logs:/app/execution_logs
      - ./test_suite_config.yml:/app/test_suite_config.yml
      - ./requirements-test.txt:/app/requirements-test.txt
    environment:
      - TEST_ENV=docker
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - lp1_banco
      - lp2_reniec
    networks:
      - testing_network
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de datos PostgreSQL para tests
  postgres:
    image: postgres:15
    container_name: shibasito_testing_postgres
    environment:
      POSTGRES_DB: testing_db
      POSTGRES_USER: testing_user
      POSTGRES_PASSWORD: testing_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"  # Puerto alternativo para evitar conflictos
    volumes:
      - postgres_testing_data:/var/lib/postgresql/data
      - ./database/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql
    networks:
      - testing_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testing_user -d testing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    container_name: shibasito_testing_redis
    ports:
      - "6380:6379"  # Puerto alternativo
    command: redis-server --appendonly yes --requirepass testing_redis_pass
    volumes:
      - redis_testing_data:/data
      - ./redis-config/testing.conf:/usr/local/etc/redis/redis.conf
    networks:
      - testing_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "testing_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ para message queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shibasito_testing_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: testing_rabbit
      RABBITMQ_DEFAULT_PASS: testing_rabbit_pass
    ports:
      - "5674:5672"   # Puerto AMQP
      - "15674:15672" # Puerto Management UI
    volumes:
      - rabbitmq_testing_data:/var/lib/rabbitmq
      - ./rabbitmq-config/testing-definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-config/testing-rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - testing_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Servicio Banco LP1 (simulado para testing)
  lp1_banco:
    build:
      context: ../lp1-servicio-banco
      dockerfile: Dockerfile.testing
    container_name: shibasito_testing_lp1
    environment:
      - DATABASE_URL=postgresql://testing_user:testing_password@postgres:5432/testing_db
      - REDIS_URL=redis://:testing_redis_pass@redis:6379/1
      - RABBITMQ_URL=amqp://testing_rabbit:testing_rabbit_pass@rabbitmq:5672/
      - TESTING_MODE=true
      - LOG_LEVEL=INFO
    ports:
      - "8004:8001"  # Puerto alternativo para testing
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - testing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Servicio RENIEC LP2 (simulado para testing)
  lp2_reniec:
    build:
      context: ../lp2_reniec_service
      dockerfile: Dockerfile.testing
    container_name: shibasito_testing_lp2
    environment:
      - DATABASE_URL=postgresql://testing_user:testing_password@postgres:5432/testing_db
      - TESTING_MODE=true
      - LOG_LEVEL=INFO
      - API_VERSION=v1
    ports:
      - "8005:8002"  # Puerto alternativo para testing
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - testing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx como proxy reverso para E2E testing
  nginx:
    image: nginx:alpine
    container_name: shibasito_testing_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx-config/testing.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-config/sites-available:/etc/nginx/sites-available:ro
    depends_on:
      - lp1_banco
      - lp2_reniec
    networks:
      - testing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring - Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: shibasito_testing_prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_testing_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - testing_network
    profiles:
      - monitoring

  # Monitoring - Grafana para dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: shibasito_testing_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_testing_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - testing_network
    profiles:
      - monitoring

  # Selenium Grid para E2E testing avanzado
  selenium_hub:
    image: selenium/hub:4.11.0
    container_name: shibasito_testing_selenium_hub
    ports:
      - "4444:4444"
      - "4443:4443"
      - "4442:4442"
    environment:
      - GRID_MAX_SESSION=16
      - GRID_BROWSER_TIMEOUT=300
      - GRID_TIMEOUT=300
    networks:
      - testing_network
    profiles:
      - selenium

  selenium_chrome:
    image: selenium/node-chrome:4.11.0
    container_name: shibasito_testing_selenium_chrome
    depends_on:
      - selenium_hub
    environment:
      - HUB_HOST=selenium_hub
      - HUB_PORT=4444
      - NODE_MAX_INSTANCES=4
      - NODE_MAX_SESSION=4
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - testing_network
    profiles:
      - selenium

  # Load testing con JMeter
  jmeter:
    build:
      context: .
      dockerfile: Dockerfile.jmeter
    container_name: shibasito_testing_jmeter
    volumes:
      - ./performance_tests/jmeter:/jmeter/tests
      - ./reports/jmeter:/jmeter/reports
    command: >
      jmeter -n 
      -t /jmeter/tests/test_plan.jmx 
      -l /jmeter/results/results.jtl 
      -e 
      -o /jmeter/reports
    depends_on:
      - lp1_banco
      - lp2_reniec
    networks:
      - testing_network
    profiles:
      - load-testing

# Volúmenes para persistencia de datos
volumes:
  postgres_testing_data:
    driver: local
  redis_testing_data:
    driver: local
  rabbitmq_testing_data:
    driver: local
  prometheus_testing_data:
    driver: local
  grafana_testing_data:
    driver: local

# Red para comunicación entre servicios
networks:
  testing_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Configuraciones adicionales
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Hooks para diferentes escenarios de testing
x-testing-hooks:
  &default-hooks
  # Hook para tests rápidos (solo unitarios)
  quick-tests:
    override:
      testing:
        command: python run_all_tests.py --config quick_config.yml
      depends_on:
        postgres:
          condition: service_healthy
  
  # Hook para tests completos (todos los tipos)
  full-tests:
    override:
      testing:
        command: python run_all_tests.py --config full_config.yml --generate-report
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
        lp1_banco:
          condition: service_healthy
        lp2_reniec:
          condition: service_healthy

# Comandos útiles para desarrollo
x-dev-commands:
  &dev-commands
  # Desarrollo - Interactive mode
  interactive:
    override:
      testing:
        command: bash
        stdin_open: true
        tty: true
        volumes:
          - .:/app
          - ./reports:/app/reports
          - ./execution_logs:/app/execution_logs
  
  # Debug mode con shell y logs
  debug:
    override:
      testing:
        command: python -m pdb run_all_tests.py
        stdin_open: true
        tty: true
        volumes:
          - .:/app
          - ./reports:/app/reports
          - ./execution_logs:/app/execution_logs