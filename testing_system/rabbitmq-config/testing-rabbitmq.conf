# RabbitMQ Configuration for Testing
# ==================================

# RabbitMQ Configuration File
# Configuración específica para ambiente de testing

# Listeners
listeners.tcp.default = 5674
management.tcp.default = 15674

# Authentication
default_user = testing_rabbit
default_pass = testing_rabbit_pass
default_user_tags = administrator
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Performance tuning for testing
channel_max = 2047
frame_max = 131072
heartbeat = 60

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.0

# Logging
log.console.level = info
log.console = true

# Queue settings for testing
default_queue_type = classic
default_durable = true
default_auto_delete = false

# Message TTL settings
default_message_ttl = 86400000  # 24 hours
default_priority = 0

# Consumer settings
default_consumer_prefetch = 10
default_consumer_timeout = 30000

# Testing specific configurations
testing_mode = true
metrics_collection_interval = 10
connection_timeout = 30000