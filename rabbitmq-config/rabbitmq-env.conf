# =============================================================================
# RABBITMQ ENVIRONMENT CONFIGURATION
# Variables de entorno para RabbitMQ
# =============================================================================

# =============================================================================
# CONFIGURACIONES DE SERVIDOR
# =============================================================================

# Puerto del servidor RabbitMQ
RABBITMQ_NODE_PORT=5672

# Nombre del nodo RabbitMQ
RABBITMQ_NODENAME=rabbit@localhost

# Hostname del nodo
RABBITMQ_NODENAME=rabbit@rabbitmq

# Home directory de RabbitMQ
RABBITMQ_MNESIA_BASE=/var/lib/rabbitmq/mnesia

# Directorio de logs
RABBITMQ_LOG_BASE=/var/log/rabbitmq

# Directorio de configuración
RABBITMQ_CONFIG_FILE=/etc/rabbitmq/rabbitmq

# Directorio de plugins
RABBITMQ_PLUGINS_DIR=/usr/lib/rabbitmq/plugins

# =============================================================================
# CONFIGURACIONES DE MEMORIA Y PERFORMANCE
# =============================================================================

# Configuración de memoria
# Porcentaje de memoria total que puede usar RabbitMQ antes de entrar en flujo de control
RABBITMQ_VM_MEMORY_HIGH_WATERMARK=0.6

# Límite absoluto de memoria (opcional)
# RABBITMQ_VM_MEMORY_HIGH_WATERMARK_ABSOLUTE=4GB

# Límite de disco
RABBITMQ_DISK_FREE_LIMIT=1GB

# Configuración de paginación
RABBITMQ_VM_MEMORY_HIGH_WATERMARK_PAGING_RATIO=0.5

# =============================================================================
# CONFIGURACIONES DE CLUSTERING
# =============================================================================

# Nodes del cluster
# RABBITMQ_CLUSTER_NODES=rabbit@node1,rabbit@node2,rabbit@node3

# Backend de descubrimiento de peers
RABBITMQ_CLUSTER_PEER_DISCOVERY_BACKEND=classic_config

# =============================================================================
# CONFIGURACIONES DE RED Y CONEXIONES
# =============================================================================

# Interfaz de red (0.0.0.0 para todas las interfaces)
RABBITMQ_LISTEN_ADDRESS=0.0.0.0

# Puerto de administración web
RABBITMQ_MANAGEMENT_PORT=15672

# Puerto de distribución Erlang
RABBITMQ_DIST_PORT=25672

# Timeouts
RABBITMQ_HANDSHAKE_TIMEOUT=30000
RABBITMQ_CONNECTION_TIMEOUT=30000

# Heartbeat interval
RABBITMQ_HEARTBEAT=60

# =============================================================================
# CONFIGURACIONES DE SEGURIDAD
# =============================================================================

# Habilitar usuarios loopback
RABBITMQ_LOOPBACK_USERS=none

# Usuario por defecto
RABBITMQ_DEFAULT_USER=admin

# Password por defecto
RABBITMQ_DEFAULT_PASS=admin123_secure_2024

# Vhost por defecto
RABBITMQ_DEFAULT_VHOST=/

# =============================================================================
# CONFIGURACIONES DE LOGGING
# =============================================================================

# Nivel de logging
RABBITMQ_LOG_LEVEL=info

# Habilitar logging a consola
RABBITMQ_LOG_CONSOLE=true

# Formato de log de consola
RABBITMQ_LOG_CONSOLE_FORMAT=text

# Rotación de logs
RABBITMQ_LOG_ROTATION_SIZE=10485760
RABBITMQ_LOG_ROTATION_COUNT=10

# =============================================================================
# CONFIGURACIONES DE PLUGINS
# =============================================================================

# Habilitar plugins específicos
# RABBITMQ_ENABLED_PLUGINS="rabbitmq_management,rabbitmq_management_agent"

# =============================================================================
# CONFIGURACIONES DE MONITOREO
# =============================================================================

# Puerto de health check
RABABBITMQ_DEFAULT_USER_TTL=1800000

# Configuraciones de métricas
RABBITMQ_METRICS_SAMPLE_INTERVAL=5000

# =============================================================================
# CONFIGURACIONES DE SSL (opcional)
# =============================================================================

# Puertos SSL (deshabilitados por defecto)
# RABBITMQ_SSL_LISTEN_PORT=5671
# RABBITMQ_SSL_MANAGEMENT_PORT=15671

# Certificados SSL
# RABBITMQ_SSL_CACERTFILE=/etc/rabbitmq/ssl/cacert.pem
# RABBITMQ_SSL_CERTFILE=/etc/rabbitmq/ssl/cert.pem
# RABBITMQ_SSL_KEYFILE=/etc/rabbitmq/ssl/key.pem

# =============================================================================
# CONFIGURACIONES DE BASE DE DATOS MNESIA
# =============================================================================

# Tabla de Mnesia
RABBITMQ_MNESIA_BASE=/var/lib/rabbitmq/mnesia

# Tipo de nodo (disc para persistente, ram para memoria)
RABBITMQ_NODE_TYPE=disc

# =============================================================================
# CONFIGURACIONES DE CONSUMIDORES Y PRODUCTORES
# =============================================================================

# Prefetch count por defecto
RABBITMQ_DEFAULT_CONSUMER_PREFETCH=10

# Publisher confirms
RABBITMQ_PUBLISHER_CONFIRMS=true

# =============================================================================
# CONFIGURACIONES DE HEALTH CHECKS
    # =============================================================================

# Timeout para health checks
RABBITMQ_HEALTH_CHECK_TIMEOUT=10000

# Intervalo de health checks
RABBITMQ_HEALTH_CHECK_INTERVAL=30000

# =============================================================================
# CONFIGURACIONES AVANZADAS
# =============================================================================

# File descriptor limit
RABBITMQ_MAX_FILE_DESCRIPTORS=65536

# Process limit
RABBITMQ_MAX_PROCESSES=1048576

# Port limit
RABBITMQ_MAX_PORTS=65536

# =============================================================================
# CONFIGURACIONES DE BACKUP Y RECOVERY
# =============================================================================

# Configuración de backup automático
# RABBITMQ_BACKUP_LOCATION=/backups
# RABBITMQ_BACKUP_RETENTION_DAYS=30

# =============================================================================
# VARIABLES DE ENTORNO ESPECÍFICAS PARA DOCKER
# =============================================================================

# Configuración para Docker
RABBITMQ_ERLANG_COOKIE=RABBITMQ_COOKIE_SECRET_2024

# Configuración de hostname para Docker
RABBITMQ_HOSTNAME=rabbitmq

# =============================================================================
# VARIABLES PARA INTEGRACIÓN CON KUBERNETES (si aplica)
# =============================================================================

# RABBITMQ_KUBERNETES_MODE=true
# RABBITMQ_KUBERNETES_NAMESPACE=default
# RABBITMQ_KUBERNETES_HOSTNAME_SUFFIX=.rabbitmq.default.svc.cluster.local

# =============================================================================
# CONFIGURACIONES DE LOGGING AVANZADO
# =============================================================================

# Logger handlers
RABBITMQ_LOG_HANDLERS="[{file,\"/var/log/rabbitmq/rabbit.log\"}]"

# SASL logging
RABBITMQ_SASL_LOG_FILE=/var/log/rabbitmq/rabbit-sasl.log

# =============================================================================
# CONFIGURACIONES DE TIMEZONE
# =============================================================================

# Timezone para logs
TZ=UTC

# =============================================================================
# CONFIGURACIONES DE JMX (para monitoreo con JConsole)
# =============================================================================

# JMX management
# RABBITMQ_MANAGEMENT_JMX=true
# RABBITMQ_MANAGEMENT_JMX_PORT=9999

# =============================================================================
# VARIABLES DE DEBUGEGING Y DESARROLLO
# =============================================================================

# Habilitar debugging (solo para desarrollo)
# RABBITMQ_DEBUG=true
# RABBITMQ_DEBUG_LEVEL=debug

# Proxy configuration (si aplica)
# HTTP_PROXY=http://proxy.company.com:8080
# HTTPS_PROXY=http://proxy.company.com:8080
# NO_PROXY=localhost,127.0.0.1,.localdomain,.company.com

# =============================================================================
# CONFIGURACIONES FINALES
# =============================================================================

# Número de worker threads para operaciones de I/O
RABBITMQ_IO_THREAD_POOL_SIZE=30

# Configuración de histéresis para control de flujo
RABBITMQ_FLOW_CONTROL_HYSTESIS=0.5

# =============================================================================
# NOTAS IMPORTANTES
# =============================================================================
# - Estas configuraciones se cargan antes que rabbitmq.conf
# - Las variables de entorno tienen prioridad sobre rabbitmq.conf
# - Usar solo las configuraciones necesarias para tu entorno
# - Comentar las configuraciones SSL si no se usan
# - Ajustar los límites de memoria según tu hardware
# - Configurar el clustering antes de iniciar la producción
# =============================================================================