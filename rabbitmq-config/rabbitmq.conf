# =============================================================================
# RABBITMQ MAIN CONFIGURATION
# Configuración principal de RabbitMQ para sistema distribuido
# =============================================================================

# =============================================================================
# CONFIGURACIONES BÁSICAS DEL SERVIDOR
# =============================================================================

# Configuración de usuario por defecto
loopback_users.guest = false
default_user = admin
default_pass = admin123_secure_2024
default_vhost = /
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# =============================================================================
# CONFIGURACIONES DE RED Y PUERTOS
# =============================================================================

# Puerto AMQP estándar
listeners.tcp.default = 5672

# Puerto de administración web
management.listener.port = 15672
management.listener.ip = 0.0.0.0

# Puerto de distribución Erlang (para clustering)
dist_listen.port = 25672

# Configuración de red
default_permissions.configure = .*
default_permissions.write = .*
default_permissions.read = .*

# =============================================================================
# CONFIGURACIONES DE MEMORIA Y DISCO
# =============================================================================

# Límite de memoria (60% del total)
vm_memory_high_watermark.relative = 0.6

# Ratio de paginación (50% del límite alto de memoria)
vm_memory_high_watermark_paging_ratio = 0.5

# Límite absoluto de memoria (opcional)
# vm_memory_high_watermark.absolute = 4GB

# Límite de espacio libre en disco
disk_free_limit.absolute = 1GB

# Límite porcentual de espacio libre
# disk_free_limit.relative = 0.5

# =============================================================================
# CONFIGURACIONES DE TIMEYOUTS Y PERFORMANCE
# =============================================================================

# Timeouts de conexión
handshake_timeout = 30000
connection_timeout = 30000
channel_operation_timeout = 30000

# Heartbeat
heartbeat = 60

# Tamaño máximo de frame
frame_max = 131072

# =============================================================================
# CONFIGURACIONES DE COLAS
# =============================================================================

# Tipo de cola por defecto
default_queue_type = classic

# Durabilidad por defecto
default_queue_durable = true

# Configuración de prefetch
# prefetch_count = 10

# Configuración de lazy queues (para uso de disco)
# default_queue_lazy_queue_properties = []

# =============================================================================
# CONFIGURACIONES DE SEGURIDAD
# =============================================================================

# Backend de autenticación
auth_backends.1 = rabbit_auth_backend_internal

# Configuración de credenciales
password_hashing_module = rabbit_auth_mechanism_plain_crypto

# Heartbeat para seguridad
heartbeat = 60

# =============================================================================
# CONFIGURACIONES DE CLUSTERING
# =============================================================================

# Configuración de clustering para futuros escalamientos
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@localhost
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq2

# Nodos del cluster
cluster_nodes.disc = rabbit@localhost
cluster_nodes.ram = 

# Configuración de formador de clusters
cluster_formation.node_type = disc

# =============================================================================
# CONFIGURACIONES DE LOGGING
# =============================================================================

# Niveles de logging específicos
log_levels.connection = error
log_levels.channel = info
log_levels.queue = info
log_levels.mirroring = info
log_levels.default = info

# Configuración de archivos de log
log.file = rabbit.log
log.console = true
log.console_level = info

# SASL logging
log.sasl = true

# =============================================================================
# CONFIGURACIONES DE MONITOREO Y MÉTRICAS
# =============================================================================

# Habilitar management plugin
management.enable_prometheus = true

# Retención de métricas (políticas de retención)
management.sample_retention_policies.global.minute = 1d
management.sample_retention_policies.global.minute_5 = 30d
management.sample_retention_policies.rabbitmq_admin.minute_5 = 30d

# Intervalo de muestreo de métricas
management.sample_retention_policies.global.sample_interval = 60

# Configuración de health checks
default_health_check_timeout = 10000

# =============================================================================
# CONFIGURACIONES DE SSL (CONFIGURACIÓN DESHABILITADA)
# =============================================================================

# SSL listeners (deshabilitados por defecto)
# ssl_options.cacertfile = /etc/rabbitmq/ssl/cacert.pem
# ssl_options.certfile = /etc/rabbitmq/ssl/cert.pem
# ssl_options.keyfile = /etc/rabbitmq/ssl/key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = false

# listeners.ssl.default = 5671

# =============================================================================
# CONFIGURACIONES DE RATE LIMITING
# =============================================================================

# Configuración de flow control
flow_control.scale_factor = 2

# Consumer timeout
default_consumer_timeout = 30000

# Publisher confirms
publisher_confirms = true

# =============================================================================
# CONFIGURACIONES DE PLUGINS
# =============================================================================

# Habilitar plugins de management
management.load_definitions = /etc/rabbitmq/definitions.json

# Configuración de plugins habilitados
# enabled_plugins_file = /etc/rabbitmq/enabled_plugins

# =============================================================================
# CONFIGURACIONES AVANZADAS DE COLAS
# =============================================================================

# Dead letter exchange por defecto
default_dead_letter_exchange = amq.direct

# Política de expiración
# queue_expiration_mode = all_but_mandatory

# Configuración de particionamiento
# cluster_formation.classic_config.nodes.1 = rabbit@node1

# =============================================================================
# CONFIGURACIONES DE HIGH AVAILABILITY (HA)
# =============================================================================

# Configuración de políticas HA (se define en definitions.json)
# Configuración de espejo de colas
# ha-mode: all - todas las colas se replican en todos los nodos
# ha-sync-mode: automatic - sincronización automática
# ha-params: 0 - sin límite de nodos

# =============================================================================
# CONFIGURACIONES DE TLS/SSL PARA AMQP
# =============================================================================

# Configuración de seguridad TLS
# ssl_options.cacertfile = /etc/rabbitmq/ssl/cacert.pem
# ssl_options.certfile = /etc/rabbitmq/ssl/cert.pem
# ssl_options.keyfile = /etc/rabbitmq/ssl/key.pem
# ssl_options.versions.1 = tlsv1.2
# ssl_options.versions.2 = tlsv1.3
# ssl_options.ciphers.1 = ECDHE-RSA-AES256-GCM-SHA384
# ssl_options.ciphers.2 = ECDHE-RSA-AES128-GCM-SHA256

# =============================================================================
# CONFIGURACIONES DE IMPORTACIÓN/EXPORTACIÓN
# =============================================================================

# Configuración de definciones (se carga automáticamente)
# definitions.import_backend = local_filesystem
# definitions.local.path = /etc/rabbitmq/definitions.json

# =============================================================================
# CONFIGURACIONES DE TRACING
# =============================================================================

# Configuración de tracing para debugging
# tracing.directory = /var/log/rabbitmq/traces
# tracing.max_trace_chars = 8192

# =============================================================================
# CONFIGURACIONES DE PROMETHEUS (SI SE HABILITA)
# =============================================================================

# Prometheus metrics
# management.prometheus.ports = 9419
# management.prometheus.return_absolute_metrics = true

# =============================================================================
# CONFIGURACIONES DE LÍMITES
# =============================================================================

# Límites de procesos
max_connections = 1000
max_channels_per_connection = 200

# Límites de file descriptors
# max_file_descriptors = 65536

# =============================================================================
# CONFIGURACIONES DE EVENTOS
# =============================================================================

# Configuración del event exchange
# event_exchange = amq.event

# =============================================================================
# CONFIGURACIONES DE STOMP (SI SE USA)
# =============================================================================

# Configuración de STOMP (opcional)
# stomp.listeners.tcp.1 = 61613
# stomp.default_user = guest
# stomp.default_pass = guest
# stomp.implicit_connect = true

# =============================================================================
# CONFIGURACIONES DE MQTT (SI SE USA)
# =============================================================================

# Configuración de MQTT (opcional)
# mqtt.listeners.tcp.1 = 1883
# mqtt.default_user = guest
# mqtt.default_pass = guest
# mqtt.vhost = /
# mqtt.allow_anonymous = true

# =============================================================================
# CONFIGURACIONES DE WEB STOMP (SI SE USA)
# =============================================================================

# Web STOMP (opcional)
# web_stomp.ws_frame.max = 8192
# web_stomp.transport.brokers.1 = 0.0.0.0:5672

# =============================================================================
# CONFIGURACIONES DE LDAP (SI SE USA)
# =============================================================================

# Configuración de LDAP para autenticación (opcional)
# auth_ldap.servers.1 = ldap.example.com
# auth_ldap.port = 389
# auth_ldap.dn_lookup_base = ou=users,dc=example,dc=com
# auth_ldap.dn_lookup_attribute = uid
# auth_ldap.bind_user_base = ou=users,dc=example,dc=com
# auth_ldap.bind_user_dn_pattern = uid=${username},ou=users,dc=example,dc=com
# auth_ldap.user_dn_pattern = uid=${username},ou=users,dc=example,dc=com

# =============================================================================
# CONFIGURACIONES FINALES DE COMPAIBILIDAD
# =============================================================================

# Configuraciones de compatibilidad
# log_format = text
# tcp_listen_options = [{backlog, 128}, {nodelay, true}]

# =============================================================================
# NOTAS DE CONFIGURACIÓN
# =============================================================================
# 1. Este archivo se complementa con advanced.config para configuraciones Erlang
# 2. Las definiciones de exchanges, queues, bindings se cargan desde definitions.json
# 3. Las variables de entorno de rabbitmq-env.conf tienen prioridad sobre este archivo
# 4. Para producción, deshabilitar usuarios guest y configurar SSL
# 5. Ajustar los límites de memoria y disco según tu hardware disponible
# 6. Configurar clustering antes de usar en producción
# 7. Habilitar monitoring y alertas para salud del sistema
# =============================================================================