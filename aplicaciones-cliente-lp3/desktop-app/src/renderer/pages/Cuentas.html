<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas Bancarias - Banco Desktop</title>
    <link href="../../renderer/css/main.css" rel="stylesheet">
    <link href="../../renderer/css/components.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="cuentas-container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-credit-card"></i>
                    Gestión de Cuentas
                </h1>
                <p>Administra tus cuentas bancarias</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showCreateAccountModal()">
                    <i class="fas fa-plus"></i>
                    Nueva Cuenta
                </button>
            </div>
        </div>

        <!-- Filters and Search -->
        <div class="filters-section">
            <div class="search-bar">
                <div class="search-input">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchAccounts" placeholder="Buscar cuentas...">
                </div>
                <select id="accountTypeFilter" class="filter-select">
                    <option value="">Todos los tipos</option>
                    <option value="ahorros">Ahorros</option>
                    <option value="corriente">Corriente</option>
                    <option value="plazo_fijo">Plazo Fijo</option>
                </select>
                <select id="accountStatusFilter" class="filter-select">
                    <option value="">Todos los estados</option>
                    <option value="active">Activas</option>
                    <option value="inactive">Inactivas</option>
                    <option value="blocked">Bloqueadas</option>
                </select>
            </div>
        </div>

        <!-- Accounts Grid -->
        <div class="accounts-section">
            <div id="accountsList" class="accounts-grid">
                <!-- Las cuentas se cargarán dinámicamente -->
            </div>
        </div>

        <!-- Create Account Modal -->
        <div id="createAccountModal" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h3>Crear Nueva Cuenta</h3>
                    <button class="modal-close" onclick="closeCreateAccountModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="createAccountForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="accountType">Tipo de Cuenta *</label>
                                <select id="accountType" name="accountType" class="form-control" required>
                                    <option value="">Seleccionar tipo</option>
                                    <option value="ahorros">Cuenta de Ahorros</option>
                                    <option value="corriente">Cuenta Corriente</option>
                                    <option value="plazo_fijo">Plazo Fijo</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="initialBalance">Saldo Inicial</label>
                                <input type="number" id="initialBalance" name="initialBalance" 
                                       class="form-control" step="0.01" min="0" placeholder="0.00">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="accountDescription">Descripción (Opcional)</label>
                            <input type="text" id="accountDescription" name="description" 
                                   class="form-control" maxlength="100" 
                                   placeholder="Ej: Cuenta principal, Ahorros vacaciones">
                        </div>

                        <div class="form-info">
                            <div class="info-item">
                                <i class="fas fa-info-circle"></i>
                                <span>Al crear una cuenta se generará automáticamente un número único</span>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateAccountModal()">
                        Cancelar
                    </button>
                    <button type="submit" form="createAccountForm" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        Crear Cuenta
                    </button>
                </div>
            </div>
        </div>

        <!-- Account Details Modal -->
        <div id="accountDetailsModal" class="modal-overlay hidden">
            <div class="modal modal-large">
                <div class="modal-header">
                    <h3 id="accountDetailsTitle">Detalles de Cuenta</h3>
                    <button class="modal-close" onclick="closeAccountDetailsModal()">&times;</button>
                </div>
                <div class="modal-body" id="accountDetailsContent">
                    <!-- El contenido se carga dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAccountDetailsModal()">
                        Cerrar
                    </button>
                    <button type="button" class="btn btn-primary" onclick="editAccount()">
                        <i class="fas fa-edit"></i>
                        Editar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class CuentasPage {
            constructor() {
                this.accounts = [];
                this.filteredAccounts = [];
                this.currentPage = 1;
                this.itemsPerPage = 6;
            }

            async render() {
                return `
                    <div id="cuentas-content">
                        ${document.getElementById('cuentas-container').outerHTML}
                    </div>
                `;
            }

            async mount() {
                await this.loadAccounts();
                this.setupEventListeners();
                this.renderAccounts();
            }

            async loadAccounts() {
                try {
                    if (window.electronAPI?.database) {
                        const result = await window.electronAPI.database.read('accounts', {});
                        this.accounts = result || [];
                    } else {
                        // Datos de demostración
                        this.accounts = this.getDemoAccounts();
                    }
                    this.filteredAccounts = [...this.accounts];
                } catch (error) {
                    console.error('Error loading accounts:', error);
                    this.accounts = this.getDemoAccounts();
                    this.filteredAccounts = [...this.accounts];
                }
            }

            getDemoAccounts() {
                return [
                    {
                        id: 1,
                        account_number: '201234567890',
                        account_type: 'ahorros',
                        balance: 8420.50,
                        status: 'active',
                        description: 'Cuenta principal de ahorros',
                        created_at: '2023-01-15T10:30:00Z'
                    },
                    {
                        id: 2,
                        account_number: '201234567891',
                        account_type: 'corriente',
                        balance: 5000.00,
                        status: 'active',
                        description: 'Cuenta corriente empresarial',
                        created_at: '2023-02-20T14:15:00Z'
                    },
                    {
                        id: 3,
                        account_number: '201234567892',
                        account_type: 'plazo_fijo',
                        balance: 2000.00,
                        status: 'active',
                        description: 'Plazo fijo 12 meses',
                        created_at: '2023-03-10T09:45:00Z'
                    },
                    {
                        id: 4,
                        account_number: '201234567893',
                        account_type: 'ahorros',
                        balance: 1200.00,
                        status: 'inactive',
                        description: 'Ahorros para vacaciones',
                        created_at: '2023-01-20T16:20:00Z'
                    }
                ];
            }

            setupEventListeners() {
                // Search
                const searchInput = document.getElementById('searchAccounts');
                if (searchInput) {
                    searchInput.addEventListener('input', 
                        window.utils.debounce((e) => this.filterAccounts(), 300)
                    );
                }

                // Filters
                const typeFilter = document.getElementById('accountTypeFilter');
                const statusFilter = document.getElementById('accountStatusFilter');
                
                if (typeFilter) {
                    typeFilter.addEventListener('change', () => this.filterAccounts());
                }
                
                if (statusFilter) {
                    statusFilter.addEventListener('change', () => this.filterAccounts());
                }

                // Create account form
                const createForm = document.getElementById('createAccountForm');
                if (createForm) {
                    createForm.addEventListener('submit', (e) => this.handleCreateAccount(e));
                }
            }

            filterAccounts() {
                const searchTerm = document.getElementById('searchAccounts')?.value.toLowerCase() || '';
                const typeFilter = document.getElementById('accountTypeFilter')?.value || '';
                const statusFilter = document.getElementById('accountStatusFilter')?.value || '';

                this.filteredAccounts = this.accounts.filter(account => {
                    const matchesSearch = account.account_number.toLowerCase().includes(searchTerm) ||
                                        (account.description && account.description.toLowerCase().includes(searchTerm));
                    const matchesType = !typeFilter || account.account_type === typeFilter;
                    const matchesStatus = !statusFilter || account.status === statusFilter;

                    return matchesSearch && matchesType && matchesStatus;
                });

                this.renderAccounts();
            }

            renderAccounts() {
                const container = document.getElementById('accountsList');
                if (!container) return;

                if (this.filteredAccounts.length === 0) {
                    container.innerHTML = this.getEmptyState();
                    return;
                }

                container.innerHTML = this.filteredAccounts.map(account => `
                    <div class="account-card">
                        <div class="account-card-header">
                            <div class="account-type-icon">
                                <i class="fas ${this.getAccountTypeIcon(account.account_type)}"></i>
                            </div>
                            <div class="account-type-info">
                                <h4>${window.utils.toTitleCase(account.account_type)}</h4>
                                <p>${account.description || 'Sin descripción'}</p>
                            </div>
                            <div class="account-status">
                                <span class="status-badge status-${account.status}">
                                    ${window.utils.toTitleCase(account.status)}
                                </span>
                            </div>
                        </div>
                        
                        <div class="account-card-body">
                            <div class="account-balance">
                                <div class="balance-label">Saldo Disponible</div>
                                <div class="balance-amount">${window.utils.formatCurrency(account.balance)}</div>
                            </div>
                            
                            <div class="account-number-display">
                                <small>Número de Cuenta</small>
                                <strong>${this.formatAccountNumber(account.account_number)}</strong>
                            </div>
                            
                            <div class="account-meta">
                                <small>Creada: ${window.utils.formatDate(account.created_at)}</small>
                            </div>
                        </div>
                        
                        <div class="account-card-footer">
                            <button class="btn btn-sm btn-outline" onclick="cuentasPage.viewAccountDetails(${account.id})">
                                <i class="fas fa-eye"></i>
                                Ver Detalles
                            </button>
                            <button class="btn btn-sm btn-primary" onclick="cuentasPage.editAccount(${account.id})">
                                <i class="fas fa-edit"></i>
                                Editar
                            </button>
                            ${account.status === 'active' ? `
                                <button class="btn btn-sm btn-warning" onclick="cuentasPage.blockAccount(${account.id})">
                                    <i class="fas fa-lock"></i>
                                    Bloquear
                                </button>
                            ` : `
                                <button class="btn btn-sm btn-success" onclick="cuentasPage.activateAccount(${account.id})">
                                    <i class="fas fa-unlock"></i>
                                    Activar
                                </button>
                            `}
                        </div>
                    </div>
                `).join('');
            }

            getEmptyState() {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-credit-card"></i>
                        </div>
                        <h3>No se encontraron cuentas</h3>
                        <p>No hay cuentas que coincidan con los filtros seleccionados</p>
                        <button class="btn btn-primary" onclick="showCreateAccountModal()">
                            <i class="fas fa-plus"></i>
                            Crear Primera Cuenta
                        </button>
                    </div>
                `;
            }

            getAccountTypeIcon(type) {
                const icons = {
                    'ahorros': 'fa-piggy-bank',
                    'corriente': 'fa-briefcase',
                    'plazo_fijo': 'fa-calendar-alt'
                };
                return icons[type] || 'fa-credit-card';
            }

            formatAccountNumber(accountNumber) {
                // Formatear número como XXXX-XXXX-XXXX
                return accountNumber.replace(/(\d{4})(\d{4})(\d{4})(\d{2})/, '$1-$2-$3-$4');
            }

            async handleCreateAccount(event) {
                event.preventDefault();
                
                const formData = new FormData(event.target);
                const accountData = {
                    account_number: window.utils.generateAccountNumber(),
                    account_type: formData.get('accountType'),
                    balance: parseFloat(formData.get('initialBalance')) || 0,
                    description: formData.get('description') || '',
                    status: 'active',
                    created_at: new Date().toISOString()
                };

                try {
                    if (window.electronAPI?.database) {
                        const result = await window.electronAPI.database.create('accounts', accountData);
                        if (result.error) throw new Error(result.error);
                    }

                    // Agregar a la lista local
                    accountData.id = Date.now(); // ID temporal
                    this.accounts.unshift(accountData);
                    this.filterAccounts();

                    closeCreateAccountModal();
                    window.bancoApp.showNotification('Cuenta creada exitosamente', 'success');

                } catch (error) {
                    window.bancoApp.showNotification('Error al crear cuenta: ' + error.message, 'error');
                }
            }

            viewAccountDetails(accountId) {
                const account = this.accounts.find(acc => acc.id === accountId);
                if (!account) return;

                const modal = document.getElementById('accountDetailsModal');
                const title = document.getElementById('accountDetailsTitle');
                const content = document.getElementById('accountDetailsContent');

                title.textContent = `Cuenta ${window.utils.toTitleCase(account.account_type)}`;
                
                content.innerHTML = `
                    <div class="account-details-view">
                        <div class="detail-section">
                            <h4>Información General</h4>
                            <div class="detail-grid">
                                <div class="detail-item">
                                    <label>Número de Cuenta:</label>
                                    <span>${this.formatAccountNumber(account.account_number)}</span>
                                </div>
                                <div class="detail-item">
                                    <label>Tipo:</label>
                                    <span>${window.utils.toTitleCase(account.account_type)}</span>
                                </div>
                                <div class="detail-item">
                                    <label>Estado:</label>
                                    <span class="status-badge status-${account.status}">
                                        ${window.utils.toTitleCase(account.status)}
                                    </span>
                                </div>
                                <div class="detail-item">
                                    <label>Saldo Actual:</label>
                                    <span class="amount">${window.utils.formatCurrency(account.balance)}</span>
                                </div>
                            </div>
                        </div>

                        <div class="detail-section">
                            <h4>Fechas</h4>
                            <div class="detail-grid">
                                <div class="detail-item">
                                    <label>Fecha de Creación:</label>
                                    <span>${window.utils.formatDate(account.created_at, 'long')}</span>
                                </div>
                                <div class="detail-item">
                                    <label>Última Actualización:</label>
                                    <span>${window.utils.formatDate(account.created_at, 'long')}</span>
                                </div>
                            </div>
                        </div>

                        ${account.description ? `
                            <div class="detail-section">
                                <h4>Descripción</h4>
                                <p>${account.description}</p>
                            </div>
                        ` : ''}

                        <div class="detail-section">
                            <h4>Acciones Rápidas</h4>
                            <div class="quick-actions-detail">
                                <button class="btn btn-outline" onclick="cuentasPage.depositToAccount(${account.id})">
                                    <i class="fas fa-plus"></i>
                                    Depositar
                                </button>
                                <button class="btn btn-outline" onclick="cuentasPage.withdrawFromAccount(${account.id})">
                                    <i class="fas fa-minus"></i>
                                    Retirar
                                </button>
                                <button class="btn btn-outline" onclick="cuentasPage.generateQR(${account.id})">
                                    <i class="fas fa-qrcode"></i>
                                    Generar QR
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                modal.classList.remove('hidden');
            }

            async editAccount(accountId) {
                window.bancoApp.showNotification('Función de edición en desarrollo', 'info');
            }

            async blockAccount(accountId) {
                if (confirm('¿Estás seguro de que deseas bloquear esta cuenta?')) {
                    const account = this.accounts.find(acc => acc.id === accountId);
                    if (account) {
                        account.status = 'blocked';
                        this.renderAccounts();
                        window.bancoApp.showNotification('Cuenta bloqueada exitosamente', 'success');
                    }
                }
            }

            async activateAccount(accountId) {
                const account = this.accounts.find(acc => acc.id === accountId);
                if (account) {
                    account.status = 'active';
                    this.renderAccounts();
                    window.bancoApp.showNotification('Cuenta activada exitosamente', 'success');
                }
            }

            async depositToAccount(accountId) {
                window.bancoApp.showNotification('Función de depósito en desarrollo', 'info');
            }

            async withdrawFromAccount(accountId) {
                window.bancoApp.showNotification('Función de retiro en desarrollo', 'info');
            }

            generateQR(accountId) {
                const account = this.accounts.find(acc => acc.id === accountId);
                if (account) {
                    navigateTo('qr-generator');
                    // Aquí se podría pasar el ID de la cuenta al generador QR
                }
            }
        }

        // Funciones globales
        function showCreateAccountModal() {
            document.getElementById('createAccountModal').classList.remove('hidden');
        }

        function closeCreateAccountModal() {
            document.getElementById('createAccountModal').classList.add('hidden');
            document.getElementById('createAccountForm').reset();
        }

        function closeAccountDetailsModal() {
            document.getElementById('accountDetailsModal').classList.add('hidden');
        }

        function editAccount() {
            window.bancoApp.showNotification('Función de edición en desarrollo', 'info');
        }

        // Instanciar página
        window.CuentasPage = CuentasPage;
    </script>

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
        }

        .header-content h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-content p {
            color: var(--text-secondary);
            margin-left: 40px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .filters-section {
            margin-bottom: 30px;
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .account-card {
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .account-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .account-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: var(--background-color);
            border-bottom: 1px solid var(--border-color);
        }

        .account-type-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .account-type-info h4 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .account-type-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .account-card-body {
            padding: 20px;
        }

        .account-balance {
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--success-color);
        }

        .account-number-display {
            text-align: center;
            margin-bottom: 15px;
        }

        .account-number-display small {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .account-number-display strong {
            font-size: 16px;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .account-meta {
            text-align: center;
            color: var(--text-secondary);
        }

        .account-card-footer {
            padding: 15px 20px;
            background: var(--background-color);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
        }

        .account-details-view {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .detail-section h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-primary);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--background-color);
            border-radius: 6px;
        }

        .detail-item label {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .detail-item span {
            color: var(--text-primary);
        }

        .quick-actions-detail {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-info {
            background: var(--background-color);
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .info-item i {
            color: var(--primary-color);
        }

        .modal-large {
            max-width: 800px;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .accounts-grid {
                grid-template-columns: 1fr;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .account-card-footer {
                flex-direction: column;
            }
        }
    </style>
</body>
</html>
