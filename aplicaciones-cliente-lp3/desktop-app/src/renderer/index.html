<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Desktop - Sistema Bancario</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Loading Screen -->
        <div id="loading-screen" class="loading-screen">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <h2>Cargando Banco Desktop</h2>
                <p>Iniciando aplicación...</p>
            </div>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="screen hidden">
            <div class="login-container">
                <div class="login-header">
                    <h1><i class="fas fa-university"></i> Banco Desktop</h1>
                    <p>Sistema de Gestión Bancaria</p>
                </div>
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>
                <div id="login-error" class="error-message hidden"></div>
            </div>
        </div>

        <!-- Main Application -->
        <div id="main-app" class="app-container hidden">
            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <button id="menu-toggle" class="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Banco Desktop</h1>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span id="current-user">Usuario</span>
                    </div>
                    <button id="logout-btn" class="btn btn-secondary">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Sidebar Navigation -->
            <nav id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h3>Navegación</h3>
                </div>
                <ul class="nav-menu">
                    <li>
                        <a href="#" data-page="dashboard" class="nav-link active">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-page="cuentas" class="nav-link">
                            <i class="fas fa-credit-card"></i>
                            <span>Cuentas</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-page="transacciones" class="nav-link">
                            <i class="fas fa-exchange-alt"></i>
                            <span>Transacciones</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-page="prestamos" class="nav-link">
                            <i class="fas fa-money-bill-wave"></i>
                            <span>Préstamos</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-page="qr-generator" class="nav-link">
                            <i class="fas fa-qrcode"></i>
                            <span>Generador QR</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="main-content">
                <div id="page-content" class="page-content">
                    <!-- El contenido de las páginas se cargará aquí -->
                </div>
            </main>
        </div>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="modal-overlay hidden"></div>

        <!-- Notification Container -->
        <div id="notification-container" class="notification-container"></div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/qr.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
