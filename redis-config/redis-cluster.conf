# =============================================================================
# REDIS CLUSTER CONFIGURATION
# Configuración específica para Redis Cluster en modo distribuido
# Sistema Shibasito - Configuración de cluster activo
# =============================================================================

# =============================================================================
# CONFIGURACIÓN BÁSICA DE CLUSTER
# =============================================================================
# Habilitar modo cluster
cluster-enabled yes

# Archivo de configuración de nodos del cluster
cluster-config-file nodes-6379.conf

# Timeout para detectar nodo caído
cluster-node-timeout 15000

# Máximos reintentos para reasignación de slots
cluster-replica-validity-factor 10

# Permitir operaciones aunque no todos los slots estén cubiertos
cluster-require-full-coverage no

# Número mínimo de réplicas por maestro
cluster-migration-barrier 1

# =============================================================================
# CONFIGURACIÓN DE RED PARA CLUSTER
# =============================================================================
bind 0.0.0.0
port 6379

# Puerto del bus interno del cluster (puerto + 10000)
cluster-port 16379

# =============================================================================
# CONFIGURACIÓN DE SEGURIDAD PARA CLUSTER
# =============================================================================
# Contraseña requerida para operaciones de cluster
# requirepass redispass123_secure_2024

# Contraseña específica para comunicación entre nodos
# masterauth redispass123_secure_2024

# =============================================================================
# CONFIGURACIÓN DE MEMORIA PARA CLUSTER
# =============================================================================
# Límite de memoria por nodo en cluster
maxmemory 512mb
maxmemory-policy allkeys-lru

# =============================================================================
# CONFIGURACIÓN DE PERSISTENCIA PARA CLUSTER
# =============================================================================
# Mantener persistencia RDB para recuperación de nodos
save 900 1
save 300 10
save 60 10000

# Configuración AOF para cluster
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# =============================================================================
# CONFIGURACIÓN DE REPLICAS PARA CLUSTER
# =============================================================================
# Permitir lecturas de réplicas
replica-read-only yes

# Sincronización optimizada para cluster
repl-diskless-sync no
repl-diskless-sync-delay 5

# =============================================================================
# CONFIGURACIÓN DE PERFORMANCE PARA CLUSTER
# =============================================================================
# Tamaño del buffer de clientes
tcp-keepalive 300
timeout 300
tcp-backlog 511

# Frecuencia de monitoreo
hz 10

# Lazy freeing para operaciones pesadas
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# =============================================================================
# CONFIGURACIÓN DE CLIENTES EN CLUSTER
# =============================================================================
maxclients 8000

# Buffer de salida para clientes normales, réplicas y pubsub
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# =============================================================================
# CONFIGURACIÓN DE THREADS PARA CLUSTER
# =============================================================================
io-threads 4
io-threads-do-reads yes

# =============================================================================
# CONFIGURACIÓN DE SEGURIDAD ESPECÍFICA PARA CLUSTER
# =============================================================================
# Renombrar comandos peligrosos en modo cluster
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command KEYS "KEYS_SECURE"
rename-command EVAL ""
rename-command SCRIPT ""

# Comandos de cluster con renombrado
rename-command SHUTDOWN "SHUTDOWN_CLUSTER_2024"
rename-command BGSAVE "BGSAVE_CLUSTER_2024"

# =============================================================================
# CONFIGURACIÓN DE LOGGING PARA CLUSTER
# =============================================================================
loglevel notice
logfile "/var/log/redis/redis-cluster-server.log"
syslog-enabled yes
syslog-ident redis-cluster

# =============================================================================
# CONFIGURACIÓN DE DEGRADACIÓN PARA CLUSTER
# =============================================================================
# Permitir degradación gradual del cluster
cluster-allow-reads-when-down yes

# =============================================================================
# CONFIGURACIÓN DE HASHING Y DISTRIBUCIÓN
# =============================================================================
# Número de slots de hash (16384 por defecto, no modificar)
# hash-slots 16384

# Configuración de slots automática al crear cluster

# =============================================================================
# CONFIGURACIÓN DE MONITOREO Y ALERTAS
# =============================================================================
# Notificaciones de eventos de cluster
notify-keyspace-events Ex

# Latencia de monitoreo
latency-monitor-threshold 100

# =============================================================================
# CONFIGURACIÓN DE TLS/SSL PARA CLUSTER
# =============================================================================
# tls-port 6380
# tls-cert-file /path/to/cluster.crt
# tls-key-file /path/to/cluster.key
# tls-ca-cert-file /path/to/ca.crt

# =============================================================================
# CONFIGURACIÓN DE FAILOVER AUTOMÁTICO
# =============================================================================
# Tiempo de espera antes de declarar réplicas como votos
cluster-replica-no-failover yes

# =============================================================================
# CONFIGURACIÓN DE SISTEMA PARA CLUSTER
# =============================================================================
# Configuración de overcommit de memoria del kernel
# kernel oom_score_over_commit = 1

# Configuración específica para operaciones de cluster
# client-query-buffer-limit 1gb
# proto-max-bulk-len 512mb

# =============================================================================
# CONFIGURACIÓN DE RESISTENCIA A FALLOS
# =============================================================================
# Permitir que el cluster funcione con menos nodos temporalmente
cluster-announce-ip 127.0.0.1
cluster-announce-port 6379
cluster-announce-bus-port 16379

# =============================================================================
# CONFIGURACIÓN DE OPTIMIZACIÓN ESPECÍFICA
# =============================================================================
# Frecuencia de limpieza de slots expirados
hz 10

# Configuración de compresión para tráfico de cluster
# cluster-announce-ip 0.0.0.0