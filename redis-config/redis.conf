# =============================================================================
# REDIS CONFIGURATION - CONFIGURACIÓN COMPLETA Y OPTIMIZADA
# Sistema distribuido Shibasito - Configuración para producción
# =============================================================================

# =============================================================================
# CONFIGURACIÓN BÁSICA DE RED
# =============================================================================
bind 0.0.0.0
port 6379
protected-mode yes
requirepass redispass123_secure_2024
tcp-backlog 511
timeout 300
tcp-keepalive 300

# =============================================================================
# CONFIGURACIÓN DE MEMORIA Y RENDIMIENTO
# =============================================================================
# Límite de memoria - 75% de RAM disponible para Redis
maxmemory 512mb
# Política de eviction cuando se alcanza el límite
maxmemory-policy allkeys-lru

# Configuración de arquitectura
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# =============================================================================
# CONFIGURACIÓN DE PERSISTENCIA RDB
# =============================================================================
# Snapshot automático cada cierto número de operaciones
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# =============================================================================
# CONFIGURACIÓN DE PERSISTENCIA AOF (Append Only File)
# =============================================================================
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# =============================================================================
# CONFIGURACIÓN DE LOGGING Y MONITOREO
# =============================================================================
loglevel notice
logfile "/var/log/redis/redis-server.log"
syslog-enabled yes
syslog-ident redis
loglevel notice

# =============================================================================
# CONFIGURACIÓN DE SEGURIDAD AVANZADA
# =============================================================================
# Renombrar comandos peligrosos
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command KEYS "KEYS_SECURE"
rename-command EVAL ""
rename-command SCRIPT ""

# Comandos sensibles con renombrado
rename-command SHUTDOWN "SHUTDOWN_SECURE_2024"
rename-command BGSAVE "BGSAVE_SECURE_2024"
rename-command BGREWRITEAOF "BGREWRITEAOF_SECURE"

# =============================================================================
# CONFIGURACIÓN DE PERFORMANCE
# =============================================================================
# Cliente y buffer de escritura
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frecuencia de monitoreo del estado de memoria
hz 10

# Reducir latencia activando lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# =============================================================================
# CONFIGURACIÓN DE BACKUP AUTOMÁTICO
# =============================================================================
# Script de backup externo (se ejecuta vía cronjob)
# backup-cron "0 2 * * * /opt/redis/scripts/backup-redis.sh"
save-indicator no

# =============================================================================
# CONFIGURACIÓN DE CLUSTER (OPCIONAL - DESACTIVADO POR DEFECTO)
# =============================================================================
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000
# cluster-require-full-coverage no
# cluster-migration-barrier 1

# =============================================================================
# CONFIGURACIÓN DE MÓDULOS (PARA FUNCIONALIDADES EXTENDIDAS)
# =============================================================================
# Descomenta si tienes módulos específicos
# loadmodule /usr/local/lib/redis/modules/redisgraph.so
# loadmodule /usr/local/lib/redis/modules/redistimeseries.so
# loadmodule /usr/local/lib/redis/modules/redisjson.so

# =============================================================================
# CONFIGURACIÓN AVANZADA DE CLIENTES
# =============================================================================
maxclients 10000

# =============================================================================
# CONFIGURACIÓN DE THREADS Y PROCESAMIENTO
# =============================================================================
io-threads 4
io-threads-do-reads yes

# =============================================================================
# CONFIGURACIÓN DE TLS/SSL (PARA PRODUCCIÓN)
# =============================================================================
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt

# =============================================================================
# CONFIGURACIÓN DE NOTIFICACIONES DE EVENTOS
# =============================================================================
notify-keyspace-events Ex

# =============================================================================
# CONFIGURACIÓN DE DEGRADACIÓN GRADUAL
# =============================================================================
# Configuración para mantener servicio en caso de presión de memoria
replica-ignore-maxmemory yes

# =============================================================================
# CONFIGURACIÓN DE HASHING CONSISTENTE
# =============================================================================
# hash-field expiration policy
# hz 10 por defecto, ajustable según carga

# =============================================================================
# CONFIGURACIÓN DE KERNEL Y SISTEMA
# =============================================================================
# Über la máxima latencia permitida (en microsegundos)
latency-monitor-threshold 100

# Configuración de overcommit de memoria
# kernel oom_score_over_commit = 1 (recomendado para Redis)