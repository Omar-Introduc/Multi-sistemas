# Configuración de pytest para el servicio RENIEC

[pytest]
# Directorios y archivos de prueba
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    unit: Tests unitarios
    integration: Tests de integración
    slow: Tests que tardan más tiempo
    external_api: Tests que requieren APIs externas
    database: Tests que requieren base de datos
    api: Tests de endpoints de API
    models: Tests de modelos de datos
    services: Tests de servicios de negocio
    health: Tests de verificación de salud

# Configuración de salida
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html

# Configuración de log
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Configuración de filtros
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy.*
    ignore::pytest.PytestUnraisableExceptionWarning
    error::ResourceWarning

# Configuración de timeout (si pytest-timeout está instalado)
timeout = 300
timeout_method = thread

# Configuración de fixtures
# fixture_scopes = session
# usefixtures = 

# Configuración de cobertura
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */migrations/*
    */alembic/*
    */conftest.py
    */main.py
    run_under = 3.7

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov

# Configuración específica para diferentes tipos de tests

[pytest.mark.unit]
# Configuración para tests unitarios
addopts = --cov=app --cov-report=term-missing:skip-covered

[pytest.mark.integration]
# Configuración para tests de integración
addopts = --verbose --tb=long

[pytest.mark.slow]
# Configuración para tests lentos
addopts = --verbose --tb=long --durations=20

[pytest.mark.external_api]
# Configuración para tests con APIs externas
# Requieren mocking por defecto
addopts = --verbose

# Configuración de variables de entorno para tests
[tool:pytest]
env =
    ENVIRONMENT = test
    DEBUG = true
    DATABASE_URL = sqlite:///:memory:
    TESTING = true
