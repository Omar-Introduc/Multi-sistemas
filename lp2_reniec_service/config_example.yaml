# Configuración de ejemplo para el servicio lp2_reniec_service
# Este archivo muestra la estructura esperada de configuración

# Configuración del servicio
SERVICE_NAME: lp2_reniec_service
VERSION: 1.0.0
ENVIRONMENT: development

# Configuración de RabbitMQ
RABBITMQ_HOST: localhost
RABBITMQ_PORT: 5672
RABBITMQ_USERNAME: guest
RABBITMQ_PASSWORD: guest
RABBITMQ_HEARTBEAT: 600
RABBITMQ_BLOCKED_CONNECTION_TIMEOUT: 300

# Configuración de exchanges y queues
EXCHANGES:
  banco_validations: banco.validations
  reniec_config: reniec.config
  bank_heartbeat: bank.heartbeat

QUEUES:
  banco_validation_queue: banco.validation.queue
  reniec_config_queue: reniec.config.queue
  bank_heartbeat_queue: bank.heartbeat.queue

# Configuración de RENIEC
RENIEC_ENDPOINT: https://api.reniec.gob.pe
RENIEC_TIMEOUT: 30
RENIEC_MAX_RETRIES: 3
RENIEC_RETRY_DELAY: 5

# Configuración de logging
LOGGING_LEVEL: INFO
LOGGING_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Configuración de validación
VALIDATION_ENABLED: true
VALIDATION_CACHE_TTL: 300
VALIDATION_MAX_CONCURRENT_REQUESTS: 100

# Configuración de heartbeat
HEARTBEAT_ENABLED: true
HEARTBEAT_INTERVAL: 30
HEARTBEAT_TIMEOUT: 90

# Configuración de reintentos
RETRY_ATTEMPTS: 3
RETRY_DELAY: 5

# Configuración de QoS
PREFETCH_COUNT: 1

# Configuración de DLX (Dead Letter Exchange)
DLX_ENABLED: true
DLX_NAME: dlx
DLX_ROUTING_KEY: "*.failed"