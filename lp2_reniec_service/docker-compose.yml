version: '3.8'

services:
  # Aplicación FastAPI
  lp2-reniec-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=mysql+mysqlconnector://reniec_user:password_seguro@mysql:3306/reniec_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=tu-clave-secreta-muy-segura-aqui
      - ALLOWED_HOSTS=["http://localhost:3000","http://localhost:8080"]
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - mysql
      - rabbitmq
      - redis
    networks:
      - reniec-network
    restart: unless-stopped

  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_seguro
      - MYSQL_DATABASE=reniec_db
      - MYSQL_USER=reniec_user
      - MYSQL_PASSWORD=password_seguro
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - reniec-network
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - reniec-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reniec-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx (opcional para producción)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lp2-reniec-service
    networks:
      - reniec-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local

networks:
  reniec-network:
    driver: bridge