# Docker Compose para Entorno de Validación Continua
# Sistema de Validación Continua - Entorno de Testing
# Fecha: 2025-10-30

version: '3.8'

# Configuración de servicios
services:
  # Servicio principal de la aplicación
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-""}
        VCS_REF: ${VCS_REF:-""}
        VERSION: ${VERSION:-""}
    container_name: validation-app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"  # Health check port
    environment:
      # Base de datos
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/app_validation
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=app_validation
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # RabbitMQ
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      
      # Configuración de aplicación
      - ENVIRONMENT=validation
      - LOG_LEVEL=INFO
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      
      # Configuración de seguridad
      - JWT_SECRET=validation-jwt-secret-key-change-in-production
      - ENCRYPTION_KEY=validation-encryption-key-change-in-production
      
      # Configuración de health checks
      - HEALTH_CHECK_TIMEOUT=30
      - READINESS_CHECK_TIMEOUT=15
      - LIVENESS_CHECK_TIMEOUT=15
      
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - validation-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.app.validation=true"
      - "com.app.service=app"
      - "com.app.version=${VERSION:-latest}"

  # Base de datos PostgreSQL para validación
  database:
    image: postgres:15-alpine
    container_name: validation-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=app_validation
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - pg_data_validation:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/app/migrations:ro
    networks:
      - validation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_validation"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.app.validation=true"
      - "com.app.service=database"

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    container_name: validation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_password_123
    environment:
      - REDIS_PASSWORD=redis_password_123
    volumes:
      - redis_data_validation:/data
      - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - validation-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    labels:
      - "com.app.validation=true"
      - "com.app.service=redis"

  # RabbitMQ para mensajería
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: validation-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=validation
    volumes:
      - rabbitmq_data_validation:/var/lib/rabbitmq
      - ./rabbitmq-config/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - validation-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.app.validation=true"
      - "com.app.service=rabbitmq"
      - "com.app.management=15672"

  # Servicio de pruebas automatizadas
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.testing
    container_name: validation-test-runner
    restart: "no"
    environment:
      # Variables de entorno para pruebas
      - TEST_DATABASE_URL=postgresql://postgres:postgres@database:5432/app_validation
      - TEST_REDIS_URL=redis://redis:6379/0
      - TEST_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - ENVIRONMENT=validation
      - LOG_LEVEL=DEBUG
      
      # Configuración de pytest
      - PYTEST_ADDOPTS=--verbose --tb=short --cov=src --cov-report=html --cov-report=xml --junitxml=test-results.xml
      
      # Configuración de Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./coverage:/app/coverage
      - playwright-report:/app/playwright-report
    networks:
      - validation-network
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Iniciando runner de pruebas...' &&
        echo 'Esperando que los servicios estén listos...' &&
        sleep 10 &&
        echo 'Ejecutando pruebas...' &&
        pytest tests/ -v --junit-xml=test-results.xml
      "

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: validation-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_validation:/prometheus
    networks:
      - validation-network
    labels:
      - "com.app.validation=true"
      - "com.app.service=monitoring"
      - "com.app.metrics=9090"

  # Grafana para dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: validation-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data_validation:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - validation-network
    depends_on:
      - prometheus
    labels:
      - "com.app.validation=true"
      - "com.app.service=dashboard"
      - "com.app.dashboard=3000"

  # Jaeger para tracing distribuido
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: validation-jaeger
    restart: unless-stopped
    ports:
      - "14268:14268"
      - "16686:16686"
      - "14250:14250"
      - "6831:6831/udp"
      - "6832:6832/udp"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - validation-network
    labels:
      - "com.app.validation=true"
      - "com.app.service=tracing"
      - "com.app.trace-ui=16686"

  # Nginx como proxy reverso
  nginx:
    image: nginx:alpine
    container_name: validation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-config/sites:/etc/nginx/sites-enabled:ro
      - nginx_logs_validation:/var/log/nginx
    networks:
      - validation-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.app.validation=true"
      - "com.app.service=proxy"
      - "com.app.proxy=80"

  # Elasticsearch para logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: validation-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data_validation:/usr/share/elasticsearch/data
    networks:
      - validation-network
    labels:
      - "com.app.validation=true"
      - "com.app.service=logging"

  # Kibana para visualización de logs
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: validation-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - validation-network
    depends_on:
      - elasticsearch
    labels:
      - "com.app.validation=true"
      - "com.app.service=log-viz"
      - "com.app.log-ui=5601"

  # Filebeat para recolección de logs
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: validation-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/app/logs:ro
    networks:
      - validation-network
    depends_on:
      - elasticsearch
    labels:
      - "com.app.validation=true"
      - "com.app.service=log-collector"

  # Servicio de validación de seguridad
  security-scanner:
    build:
      context: ./tools/security-scanner
      dockerfile: Dockerfile
    container_name: validation-security-scanner
    restart: "no"
    environment:
      - SCAN_TARGET=http://app:8080
      - REPORT_FORMAT=json
      - OUTPUT_PATH=/reports/security-report.json
    volumes:
      - ./security-reports:/reports
    networks:
      - validation-network
    depends_on:
      app:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Ejecutando escaneo de seguridad...' &&
        sleep 5 &&
        security-scan --target \$SCAN_TARGET --output \$OUTPUT_PATH --format \$REPORT_FORMAT
      "

  # Servicio de pruebas de carga
  load-tester:
    image: grafana/k6:latest
    container_name: validation-load-tester
    restart: "no"
    volumes:
      - ./tests/performance:/scripts:ro
    networks:
      - validation-network
    depends_on:
      app:
        condition: service_healthy
    command: >
      run --out json=/reports/load-test-results.json /scripts/load-test.js

  # Servicio de monitoreo de red
  network-monitor:
    image: nicolaka/netshoot
    container_name: validation-network-monitor
    restart: "no"
    networks:
      - validation-network
    command: >
      bash -c "
        echo 'Monitoreando red...' &&
        sleep 5 &&
        netstat -tuln &&
        ping -c 3 app &&
        nslookup database &&
        dig rabbitmq
      "

# Definición de redes
networks:
  validation-network:
    driver: bridge
    name: validation-network
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    labels:
      - "com.app.validation=true"

# Definición de volúmenes
volumes:
  pg_data_validation:
    driver: local
    name: pg_data_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=database"

  redis_data_validation:
    driver: local
    name: redis_data_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=redis"

  rabbitmq_data_validation:
    driver: local
    name: rabbitmq_data_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=rabbitmq"

  prometheus_data_validation:
    driver: local
    name: prometheus_data_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=monitoring"

  grafana_data_validation:
    driver: local
    name: grafana_data_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=dashboard"

  elasticsearch_data_validation:
    driver: local
    name: elasticsearch_data_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=logging"

  nginx_logs_validation:
    driver: local
    name: nginx_logs_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=proxy"

  playwright-report:
    driver: local
    name: playwright_report_validation
    labels:
      - "com.app.validation=true"
      - "com.app.component=testing"

# Configuración de health checks personalizados
x-health-checks:
  common: &common_health_check
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

# Configuración de logging
x-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.app.validation=true"

# Aplicar configuraciones a todos los servicios
x-common-variables: &common_variables
  BUILD_DATE: ${BUILD_DATE:-""}
  VCS_REF: ${VCS_REF:-""}
  VERSION: ${VERSION:-"validation"}
  COMPOSE_PROJECT_NAME: validation-app

# Configuración de dependencias
x-dependencies: &common_dependencies
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

# Comandos útiles para el entorno de validación
# Ejecutar con: docker-compose -f docker-compose.validation.yml [comando]

# Comandos disponibles:
# - up: Iniciar todos los servicios
# - up -d: Iniciar en modo daemon
# - down: Detener todos los servicios
# - logs [servicio]: Ver logs de un servicio específico
# - exec [servicio] [comando]: Ejecutar comando en un servicio
# - run test-runner: Ejecutar pruebas
# - run security-scanner: Ejecutar escaneo de seguridad
# - run load-tester: Ejecutar pruebas de carga