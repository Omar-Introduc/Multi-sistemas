# Configuración de Validación Continua
# Sistema de Validación Continua - Configuración Principal
# Fecha: 2025-10-30

# Configuración global de validación
global:
  timeout: 300
  retries: 3
  parallel: true
  max_parallel_jobs: 5
  artifact_retention_days: 30
  log_level: "INFO"
  
  # Configuración de notificaciones
  notifications:
    enabled: true
    slack_webhook_env: "SLACK_WEBHOOK_URL"
    email_enabled: true
    email_smtp_env: "EMAIL_SMTP_HOST"
    notification_cooldown: 300  # 5 minutos entre notificaciones

# Configuración por entornos
environments:
  development:
    # Endpoints de health check
    health_endpoints:
      - "http://localhost:8080/health"
      - "http://localhost:8080/api/v1/status"
      - "http://localhost:8080/ready"
    
    # Configuración de base de datos
    database:
      host: "database"
      port: 5432
      name: "app_dev"
      username: "postgres"
      password_env: "DEV_DB_PASSWORD"
      connection_pool: 5
      max_retries: 3
      connection_timeout: 30
    
    # Configuración de Redis
    redis:
      host: "redis"
      port: 6379
      db: 0
      password_env: "DEV_REDIS_PASSWORD"
      connection_timeout: 5
      socket_timeout: 5
    
    # Configuración de RabbitMQ
    rabbitmq:
      host: "rabbitmq"
      port: 5672
      username: "guest"
      password_env: "DEV_RABBITMQ_PASSWORD"
      vhost: "/"
      connection_timeout: 30
    
    # Configuración de validación
    validation:
      enabled_checks:
        - "health"
        - "integration_tests"
        - "basic_security"
        - "configuration"
      
      thresholds:
        response_time_ms: 2000
        error_rate_percent: 5
        cpu_usage_percent: 80
        memory_usage_percent: 85
        disk_usage_percent: 90
      
      # Configuración de performance
      performance:
        enabled: false
        concurrent_users: 10
        duration_minutes: 2
        ramp_up_minutes: 1
        load_test_url: "http://localhost:8080/api/v1/load-test"
    
    # Configuración de despliegue
    deployment:
      strategy: "rolling"
      max_unavailable: 1
      max_surge: 1
      rollback_timeout: 300
      pre_deployment_pause: 10
      post_deployment_wait: 60
    
    # Configuración de alertas específicas
    alerts:
      slack_channel: "#dev-alerts"
      email_recipients: ["dev-team@example.com"]
      escalation_delay: 600  # 10 minutos
      critical_threshold: 3  # 3 fallos consecutivos

  staging:
    # Endpoints de health check
    health_endpoints:
      - "https://staging.example.com/health"
      - "https://staging.example.com/api/v1/status"
      - "https://staging.example.com/api/v1/metrics"
      - "https://staging.example.com/ready"
      - "https://staging.example.com/live"
    
    # Configuración de base de datos
    database:
      host: "staging-db.internal"
      port: 5432
      name: "app_staging"
      username: "app_user"
      password_env: "STAGING_DB_PASSWORD"
      connection_pool: 10
      max_retries: 3
      connection_timeout: 30
      ssl_mode: "require"
    
    # Configuración de Redis
    redis:
      host: "staging-redis.internal"
      port: 6379
      db: 0
      password_env: "STAGING_REDIS_PASSWORD"
      connection_timeout: 5
      socket_timeout: 5
      ssl_enabled: true
    
    # Configuración de RabbitMQ
    rabbitmq:
      host: "staging-rabbitmq.internal"
      port: 5671
      username: "app_user"
      password_env: "STAGING_RABBITMQ_PASSWORD"
      vhost: "/staging"
      connection_timeout: 30
      ssl_enabled: true
    
    # Configuración de validación
    validation:
      enabled_checks:
        - "health"
        - "integration_tests"
        - "e2e_tests"
        - "security_scan"
        - "performance"
        - "configuration"
      
      thresholds:
        response_time_ms: 1500
        error_rate_percent: 3
        cpu_usage_percent: 75
        memory_usage_percent: 80
        disk_usage_percent: 85
      
      # Configuración de performance
      performance:
        enabled: true
        concurrent_users: 25
        duration_minutes: 5
        ramp_up_minutes: 2
        load_test_url: "https://staging.example.com/api/v1/load-test"
        thresholds:
          p95_response_time_ms: 2000
          p99_response_time_ms: 5000
          max_error_rate_percent: 1
          min_requests_per_second: 50
    
    # Configuración de despliegue
    deployment:
      strategy: "blue_green"
      health_check_timeout: 300
      rollback_timeout: 600
      pre_deployment_pause: 30
      post_deployment_wait: 120
      traffic_split: 50  # Porcentaje de tráfico a la nueva versión
    
    # Configuración de alertas específicas
    alerts:
      slack_channel: "#staging-alerts"
      email_recipients: ["staging-team@example.com", "qa-team@example.com"]
      escalation_delay: 300  # 5 minutos
      critical_threshold: 2  # 2 fallos consecutivos

  production:
    # Endpoints de health check
    health_endpoints:
      - "https://app.example.com/health"
      - "https://app.example.com/api/v1/status"
      - "https://app.example.com/api/v1/metrics"
      - "https://app.example.com/ready"
      - "https://app.example.com/live"
      - "https://app.example.com/api/v1/health/detailed"
    
    # Configuración de base de datos
    database:
      host: "prod-db.internal"
      port: 5432
      name: "app_prod"
      username: "app_user"
      password_env: "PROD_DB_PASSWORD"
      connection_pool: 20
      max_retries: 5
      connection_timeout: 30
      ssl_mode: "require"
      read_replica: "prod-db-replica.internal"
    
    # Configuración de Redis
    redis:
      host: "prod-redis.internal"
      port: 6379
      db: 0
      password_env: "PROD_REDIS_PASSWORD"
      connection_timeout: 3
      socket_timeout: 3
      ssl_enabled: true
      cluster_mode: true
    
    # Configuración de RabbitMQ
    rabbitmq:
      host: "prod-rabbitmq.internal"
      port: 5671
      username: "app_user"
      password_env: "PROD_RABBITMQ_PASSWORD"
      vhost: "/production"
      connection_timeout: 20
      ssl_enabled: true
      cluster_mode: true
    
    # Configuración de validación
    validation:
      enabled_checks:
        - "health"
        - "integration_tests"
        - "e2e_tests"
        - "security_scan"
        - "performance"
        - "configuration"
        - "compliance"
      
      thresholds:
        response_time_ms: 1000
        error_rate_percent: 1
        cpu_usage_percent: 70
        memory_usage_percent: 75
        disk_usage_percent: 80
      
      # Configuración de performance
      performance:
        enabled: true
        concurrent_users: 100
        duration_minutes: 10
        ramp_up_minutes: 5
        load_test_url: "https://app.example.com/api/v1/load-test"
        thresholds:
          p95_response_time_ms: 1500
          p99_response_time_ms: 3000
          max_error_rate_percent: 0.5
          min_requests_per_second: 200
    
    # Configuración de despliegue
    deployment:
      strategy: "canary"
      health_check_timeout: 600
      rollback_timeout: 900
      pre_deployment_pause: 60
      post_deployment_wait: 300
      traffic_split: 10  # 10% inicial, incremento gradual
      canary_increment: 25  # Incremento del 25% cada 5 minutos
      canary_stabilization_time: 600  # 10 minutos de estabilización
    
    # Configuración de alertas específicas
    alerts:
      slack_channel: "#prod-alerts"
      email_recipients: ["ops-team@example.com", "oncall@example.com"]
      escalation_delay: 120  # 2 minutos
      critical_threshold: 1  # 1 fallo = alerta crítica

# Configuración de validaciones específicas
validation_checks:
  # Health checks
  health:
    enabled: true
    timeout: 30
    retries: 3
    endpoints_to_check:
      - "/health"
      - "/api/v1/status"
      - "/ready"
      - "/live"
    
    # Custom health check scripts
    custom_checks:
      - name: "database_connectivity"
        script: "scripts/check-db-connectivity.sh"
        timeout: 30
      - name: "external_api_status"
        script: "scripts/check-external-api.sh"
        timeout: 60
      - name: "queue_processing"
        script: "scripts/check-queue-status.sh"
        timeout: 30

  # Pruebas de integración
  integration_tests:
    enabled: true
    timeout: 600
    parallel_execution: true
    max_parallel: 3
    
    test_suites:
      - name: "api_tests"
        command: "pytest tests/integration_tests/api/ -v"
        timeout: 300
      - name: "database_tests"
        command: "pytest tests/integration_tests/database/ -v"
        timeout: 180
      - name: "messaging_tests"
        command: "pytest tests/integration_tests/messaging/ -v"
        timeout: 240
      - name: "auth_tests"
        command: "pytest tests/integration_tests/auth/ -v"
        timeout: 300

  # Pruebas E2E
  e2e_tests:
    enabled: false  # Habilitar solo en staging y producción
    timeout: 900
    browser: "chromium"
    headless: true
    screenshot_on_failure: true
    
    test_scenarios:
      - name: "user_login_flow"
        url: "/login"
        actions:
          - "fill_username"
          - "fill_password"
          - "click_submit"
          - "verify_dashboard"
        timeout: 60
      - name: "api_consumption"
        url: "/api/v1/test"
        actions:
          - "make_request"
          - "verify_response"
          - "check_performance"
        timeout: 30

  # Escaneo de seguridad
  security_scan:
    enabled: true
    tools:
      - name: "bandit"
        command: "bandit -r . -f json -o security-report.json"
        timeout: 300
      - name: "safety"
        command: "safety check --json --output safety-report.json"
        timeout: 120
      - name: "trivy"
        image: "aquasec/trivy:latest"
        command: "trivy image --format json -o trivy-report.json"
        timeout: 600
      - name: "gosec"
        command: "gosec -fmt sarif -out gosec-report.sarif ./..."
        timeout: 180
    
    # Configuración de compliance
    compliance:
      enabled: false  # Solo en producción
      frameworks:
        - "OWASP_Top_10"
        - "NIST_Cybersecurity_Framework"
        - "ISO_27001"

  # Validación de configuración
  configuration:
    enabled: true
    checks:
      - name: "environment_variables"
        required_vars:
          - "DATABASE_URL"
          - "REDIS_URL"
          - "RABBITMQ_URL"
          - "JWT_SECRET"
        timeout: 30
      - name: "file_permissions"
        sensitive_files:
          - ".env"
          - "config/secrets.yml"
          - "config/database.yml"
        max_permissions: "644"
        timeout: 30
      - name: "ssl_certificate"
        domains:
          - "app.example.com"
          - "api.example.com"
        timeout: 60
        check_expiry: true
        min_days_valid: 30

  # Validación de performance
  performance:
    enabled: true
    tools:
      - name: "k6"
        script: "tests/performance/load-test.js"
        vu: 10
        duration: "2m"
        timeout: 300
      - name: "artillery"
        config: "tests/performance/artillery-config.yml"
        timeout: 300
    
    metrics:
      - "response_time_p95"
      - "response_time_p99"
      - "requests_per_second"
      - "error_rate"
      - "throughput"

# Configuración de notificaciones
notifications:
  # Slack
  slack:
    enabled: true
    webhook_env: "SLACK_WEBHOOK_URL"
    channels:
      development: "#dev-alerts"
      staging: "#staging-alerts"
      production: "#prod-alerts"
    
    # Formato de mensajes
    message_format:
      success: "✅ Deploy exitoso: {environment} - {commit_sha}"
      failure: "❌ Deploy fallido: {environment} - {commit_sha}"
      warning: "⚠️ Alerta: {environment} - {message}"
      critical: "🚨 Alerta crítica: {environment} - {message}"
    
    # Configuración de rate limiting
    rate_limit:
      max_messages_per_hour: 50
      cooldown_minutes: 5

  # Email
  email:
    enabled: true
    smtp_host_env: "EMAIL_SMTP_HOST"
    smtp_port: 587
    username_env: "EMAIL_USERNAME"
    password_env: "EMAIL_PASSWORD"
    
    recipients:
      development: ["dev-team@example.com"]
      staging: ["staging-team@example.com", "qa-team@example.com"]
      production: ["ops-team@example.com", "oncall@example.com", "management@example.com"]
    
    # Templates de email
    templates:
      critical: |
        Asunto: 🚨 ALERTA CRÍTICA - {environment}
        
        Se ha detectado un problema crítico en el entorno {environment}:
        
        Servicio: {service}
        Mensaje: {message}
        Timestamp: {timestamp}
        Commit: {commit_sha}
        
        Acción requerida: Responder inmediatamente.
        
        Logs: {log_url}
      success: |
        Asunto: ✅ Deploy exitoso - {environment}
        
        El deploy se completó exitosamente en el entorno {environment}:
        
        Aplicación: {app_name}
        Versión: {version}
        Commit: {commit_sha}
        Timestamp: {timestamp}
        
        Todas las validaciones pasaron correctamente.

  # PagerDuty
  pagerduty:
    enabled: false
    integration_key_env: "PAGERDUTY_INTEGRATION_KEY"
    
    escalation_rules:
      - delay_minutes: 5
        recipients: ["team-lead@example.com"]
      - delay_minutes: 15
        recipients: ["manager@example.com"]
      - delay_minutes: 30
        recipients: ["director@example.com"]

# Configuración de retención y reporting
retention:
  # Retención de logs
  logs:
    local_retention_days: 7
    cloud_retention_days: 90
    compression: true
    
  # Retención de métricas
  metrics:
    detailed_retention_hours: 24
    aggregated_retention_days: 90
    
  # Retención de reportes
  reports:
    test_reports: 180  # días
    security_reports: 365  # días
    performance_reports: 365  # días

# Configuración de reporting
reporting:
  # Reportes automáticos
  automatic_reports:
    daily:
      enabled: true
      recipients: ["tech-lead@example.com"]
      time: "09:00"
      timezone: "UTC"
    
    weekly:
      enabled: true
      recipients: ["management@example.com"]
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    
    monthly:
      enabled: true
      recipients: ["stakeholders@example.com"]
      day: 1
      time: "09:00"
      timezone: "UTC"
  
  # Configuración de dashboards
  dashboards:
    grafana:
      enabled: true
      url: "https://grafana.example.com"
      dashboard_ids:
        health: "dashboard-health-001"
        performance: "dashboard-performance-001"
        security: "dashboard-security-001"
  
  # Métricas personalizadas
  custom_metrics:
    - name: "business_kpis"
      collection_interval: 300  # 5 minutos
      retention_days: 30
    - name: "user_satisfaction"
      collection_interval: 3600  # 1 hora
      retention_days: 90

# Configuración de integración con herramientas externas
integrations:
  # Monitoring
  prometheus:
    enabled: false
    endpoint: "http://prometheus:9090"
    metrics_path: "/metrics"
  
  grafana:
    enabled: false
    endpoint: "http://grafana:3000"
    api_token_env: "GRAFANA_API_TOKEN"
  
  # Issue tracking
  jira:
    enabled: false
    endpoint: "https://company.atlassian.net"
    username_env: "JIRA_USERNAME"
    password_env: "JIRA_PASSWORD"
    project_key: "APP"
  
  # Incident management
  pagerduty:
    enabled: false
    integration_key_env: "PAGERDUTY_INTEGRATION_KEY"
  
  # Deployment tracking
  octopus:
    enabled: false
    endpoint: "https://octopus.example.com"
    api_key_env: "OCTOPUS_API_KEY"

# Configuración de optimización
optimization:
  # Cache
  cache:
    enabled: true
    provider: "redis"
    ttl: 3600  # 1 hora
  
  # Paralelización
  parallel_execution:
    max_concurrent_jobs: 5
    max_concurrent_tests: 3
  
  # Resource limits
  resource_limits:
    max_memory_mb: 1024
    max_cpu_percent: 80
    max_disk_usage_percent: 90